<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вікторина | UA Курсова</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .quiz-page { background: #f0f2f5; min-height: 100vh; padding-top: 100px; }
        
        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .question-box h2 { color: #2c3e50; margin-bottom: 30px; font-size: 1.6rem; }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-btn {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: 0.3s;
            color: #444;
        }

        .option-btn:hover { border-color: #4285F4; background: #f8fbff; }
        .option-btn.correct { background: #2ecc71; color: white; border-color: #2ecc71; }
        .option-btn.wrong { background: #e74c3c; color: white; border-color: #e74c3c; }

        #result-area { display: none; }
        .score-circle {
            width: 150px; height: 150px;
            border-radius: 50%;
            background: #4285F4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 20px auto;
            font-weight: bold;
        }

        .restart-btn {
            background: #2c3e50;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }
        .restart-btn:hover { background: #1a1a1a; }

        .progress-bar {
            height: 10px; background: #eee;
            border-radius: 5px; margin-bottom: 20px;
            overflow: hidden;
        }
        #progress-fill { height: 100%; background: #4285F4; width: 0%; transition: 0.5s; }
    </style>
</head>
<body class="quiz-page">

    <header class="header">
        <nav class="container nav">
            <div class="logo">UA<span>Курсова</span></div>
            <div class="nav-links">
                <a href="../index.html">Головна</a>
                <a href="monuments.html">Пам’ятки</a>
                <a href="gallery.html">Галерея</a>
                <a href="map.html">Карта</a>
                <a href="quiz.html" class="active">Вікторина</a>
                <a href="about.html">Про проєкт</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="quiz-container">
            <div id="quiz-area">
                <div class="progress-bar"><div id="progress-fill"></div></div>
                <div class="question-box">
                    <p id="question-number" style="color: #4285F4; font-weight: bold;"></p>
                    <h2 id="question-text">Завантаження запитання...</h2>
                    <div class="options-grid" id="options-container">
                        </div>
                </div>
            </div>

            <div id="result-area">
                <h2>Вікторину завершено!</h2>
                <div class="score-circle" id="final-score">0</div>
                <p id="result-message" style="margin-bottom: 25px; font-size: 1.2rem;"></p>
                <button class="restart-btn" onclick="location.reload()">Спробувати ще раз</button>
            </div>
        </div>
    </main>

    <script>
        const quizData = [
    {
        q: "У якому місті знаходиться Софія Київська?",
        a: ["Львів", "Київ", "Чернігів", "Одеса"],
        correct: 1
    },
    {
        q: "Яке озеро називають 'Морським оком' Карпат?",
        a: ["Світязь", "Синевир", "Ялпуг", "Сиваш"],
        correct: 1
    },
    {
        q: "В якій області розташована Кам'янець-Подільська фортеця?",
        a: ["Тернопільська", "Хмельницька", "Вінницька", "Чернівецька"],
        correct: 1
    },
    {
        q: "Хто збудував замок у Луцьку, який тепер носить його ім'я?",
        a: ["Князь Вітовт", "Князь Любарт", "Данило Галицький", "Богдан Хмельницький"],
        correct: 1
    },
    {
        q: "Яку назву має фортеця у місті Білгород-Дністровський?",
        a: ["Хотинська", "Аккерманська", "Паланок", "Олеська"],
        correct: 1
    },
    // Додані питання:
    {
        q: "Яка архітектурна пам'ятка зображена на купюрі номіналом 200 гривень?",
        a: ["Софія Київська", "Замок Любарта", "Хортиця", "Одеська опера"],
        correct: 1
    },
    {
        q: "Де знаходиться Резиденція митрополитів, яка нині є університетом?",
        a: ["У Львові", "У Чернівцях", "У Києві", "В Івано-Франківську"],
        correct: 1
    },
    {
        q: "Замок Паланок розташований на вершині загаслого...",
        a: ["Гейзера", "Вулкана", "Льодовика", "Рифу"],
        correct: 1
    },
    {
        q: "Який стиль архітектури переважає в будівлі Одеської опери?",
        a: ["Готика", "Віденське бароко", "Конструктивізм", "Хай-тек"],
        correct: 1
    },
    {
        q: "Мисливський палац графів Шенборнів має кількість вікон, що дорівнює...",
        a: ["Кількості днів у році (365)", "Кількості тижнів (52)", "Кількості місяців (12)", "Кількості годин у добі (24)"],
        correct: 0
    }
];

        let currentQuestion = 0;
        let score = 0;

        const qText = document.getElementById("question-text");
        const qNum = document.getElementById("question-number");
        const optionsContainer = document.getElementById("options-container");
        const progressFill = document.getElementById("progress-fill");

        function loadQuestion() {
            const data = quizData[currentQuestion];
            qNum.innerText = `Запитання ${currentQuestion + 1} з ${quizData.length}`;
            qText.innerText = data.q;
            optionsContainer.innerHTML = "";
            progressFill.style.width = `${((currentQuestion) / quizData.length) * 100}%`;

            data.a.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                btn.innerText = option;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, btn) {
            const correct = quizData[currentQuestion].correct;
            const allBtns = document.querySelectorAll(".option-btn");
            
            allBtns.forEach(b => b.disabled = true); // Блокуємо інші кнопки

            if (selected === correct) {
                score++;
                btn.classList.add("correct");
            } else {
                btn.classList.add("wrong");
                allBtns[correct].classList.add("correct");
            }

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < quizData.length) {
                    loadQuestion();
                } else {
                    showResults();
                }
            }, 1500);
        }

        function showResults() {
            document.getElementById("quiz-area").style.display = "none";
            const resArea = document.getElementById("result-area");
            resArea.style.display = "block";
            
            document.getElementById("final-score").innerText = `${score}/${quizData.length}`;
            
            let msg = "";
            if (score === quizData.length) msg = "Неймовірно! Ви справжній знавець України!";
            else if (score >= quizData.length / 2) msg = "Гарний результат, але є над чим працювати.";
            else msg = "Вам варто ще раз переглянути нашу галерею!";
            
            document.getElementById("result-message").innerText = msg;
        }

        loadQuestion();
    </script>

</body>
</html>
